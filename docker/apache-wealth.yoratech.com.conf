# Apache front door for wealth.yoratech.com → Docker stack on 192.168.0.23:8000
# Install: copy to /etc/apache2/sites-available/ and enable (a2ensite + reload).
# Requires: a2enmod proxy proxy_http rewrite headers

<VirtualHost *:80>
    ServerName wealth.yoratech.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Entire app (SPA + /api + /uploads) is served by Docker nginx on :8000
    ProxyPass / http://192.168.0.23:8000/
    ProxyPassReverse / http://192.168.0.23:8000/

    ErrorLog ${APACHE_LOG_DIR}/yorawealth-error.log
    CustomLog ${APACHE_LOG_DIR}/yorawealth-access.log combined
</VirtualHost>

# If TLS is terminated here (Certbot), use the same ProxyPass and set:
#   RequestHeader set X-Forwarded-Proto "https"
#   RequestHeader set X-Forwarded-Port "443"
# and in docker/.env: COOKIE_SECURE=true plus CORS_ORIGINS including https://wealth.yoratech.com
